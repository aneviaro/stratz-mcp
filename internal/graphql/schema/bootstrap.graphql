# This is a project-authored bootstrap schema, not a fetched STRATZ snapshot.
# Local schema pull artifacts remain under the configured cache directory.
schema {
  query: DotaQuery
}

scalar Long
scalar Short

type DotaQuery {
  health: String
  player(steamAccountId: Long!): PlayerType
  players(steamAccountIds: [Long!]!): [PlayerType!]!
  match(id: Long!): MatchType
  matches(ids: [Long!]!): [MatchType!]!
  constants: ConstantQuery!
  heroStats: HeroStatsQuery!
  league(id: Int!): LeagueType
  leagues(request: LeagueRequestType!): [LeagueType!]!
  live: LiveQuery!
}

input LeagueRequestType {
  leagueIds: [Int!]
  startDateTime: Long
  endDateTime: Long
  isFuture: Boolean
  isEnded: Boolean
  isLive: Boolean
  tiers: [String!]
  take: Int!
  skip: Int!
}

input LeagueMatchesRequestType {
  startDateTime: Long
  endDateTime: Long
  gameVersionIds: [String!]
  take: Int!
  skip: Int!
}

type LeagueType {
  id: Int!
  name: String!
  displayName: String
  region: String
  tier: String
  startDateTime: Long
  endDateTime: Long
  matches(request: LeagueMatchesRequestType!): [MatchType!]!
}

type LiveQuery {
  matches(request: MatchLiveRequestType!): [MatchLiveType!]!
}

input MatchLiveRequestType {
  leagueIds: [Int!]
  heroIds: [Int!]
  gameStates: [String!]
  leagueTiers: [String!]
  orderBy: String!
  take: Int!
  skip: Int!
}

type MatchLiveType {
  matchId: Long!
  createdDateTime: Long
  gameTime: Int
  gameMode: Int
  spectators: Int
  radiantTeamId: Int
  direTeamId: Int
  league: LeagueType
  players: [MatchLivePlayerType!]!
}

type MatchLivePlayerType {
  steamAccountId: Long
  heroId: Int!
  isRadiant: Boolean!
  playerSlot: Int!
  numKills: Int
  numDeaths: Int
  numAssists: Int
  networth: Int
  level: Int
}

type ConstantQuery {
  heroes: [HeroType!]
  items: [ItemType!]
  abilities: [AbilityType!]
  gameModes: [GameModeType!]
  regions: [RegionType!]
}

type HeroType {
  id: Int
  name: String
  displayName: String
  stats: HeroStatType
  roles: [HeroRoleType!]
}

type HeroStatType {
  primaryAttribute: String
  attackType: String
}

type HeroRoleType {
  roleId: String
}

type ItemType {
  id: Int
  name: String
  displayName: String
}

type AbilityType {
  id: Int
  name: String
  language: AbilityLanguageType
}

type AbilityLanguageType {
  displayName: String
}

type GameModeType {
  id: Int
  name: String
}

type RegionType {
  id: Int
  name: String
  displayName: String
}

type HeroStatsQuery {
  winDay(
    heroIds: [Short!]
    take: Int
    skip: Int
    bracketIds: [RankBracket!]
    positionIds: [MatchPlayerPositionType!]
    groupBy: FilterHeroWinRequestGroupBy
  ): [HeroWinDayType!]
  winWeek(
    heroIds: [Short!]
    take: Int
    skip: Int
    bracketIds: [RankBracket!]
    positionIds: [MatchPlayerPositionType!]
    groupBy: FilterHeroWinRequestGroupBy
  ): [HeroWinWeekType!]
  winMonth(
    heroIds: [Short!]
    take: Int
    skip: Int
    bracketIds: [RankBracket!]
    positionIds: [MatchPlayerPositionType!]
    groupBy: FilterHeroWinRequestGroupBy
  ): [HeroWinMonthType!]
}

type HeroWinDayType {
  heroId: Int!
  day: Long!
  matchCount: Int!
  winCount: Int!
}

type HeroWinWeekType {
  heroId: Int!
  week: Long!
  matchCount: Int!
  winCount: Int!
}

type HeroWinMonthType {
  heroId: Int!
  month: Long!
  matchCount: Int!
  winCount: Int!
}

enum RankBracket {
  ANCIENT
  ARCHON
  CRUSADER
  DIVINE
  GUARDIAN
  HERALD
  IMMORTAL
  LEGEND
  UNCALIBRATED
}

enum MatchPlayerPositionType {
  ALL
  FILTERED
  POSITION_1
  POSITION_2
  POSITION_3
  POSITION_4
  POSITION_5
  UNKNOWN
}

enum FilterHeroWinRequestGroupBy {
  ALL
  HERO_ID
  HERO_ID_DURATION_MINUTES
  HERO_ID_POSITION_BRACKET
  TIME
}

type PlayerType {
  steamAccountId: Long!
  steamAccount: SteamAccountType
  identity: PlayerIdentityType
  matchCount: Int
  winCount: Int
  lastMatchDate: Long
  ranks: [PlayerRankType!]
  matches(request: PlayerMatchesRequestType!): [MatchType!]!
}

type SteamAccountType {
  id: Long
  name: String
  avatar: String
}

type PlayerIdentityType {
  name: String
}

type PlayerRankType {
  rank: Int
}

input PlayerMatchesRequestType {
  startDateTime: Long
  endDateTime: Long
  heroIds: [Int!]
  roleIds: [String!]
  gameModeIds: [Int!]
  lobbyTypeIds: [Int!]
  isVictory: Boolean
  gameVersionIds: [String!]
  take: Int!
  skip: Int!
}

type MatchType {
  id: Long!
  startDateTime: Long
  durationSeconds: Int
  didRadiantWin: Boolean
  radiantKills: Int
  direKills: Int
  gameMode: Int
  lobbyType: Int
  regionId: Int
  leagueId: Long
  gameVersionId: String
  parsedDateTime: Long
  statsDateTime: Long
  players: [MatchPlayerType!]!
  playbackData: MatchPlaybackDataType
}

type MatchPlaybackDataType {
  buildingEvents: [MatchPlaybackDataBuildingEventType!]
  roshanEvents: [MatchPlaybackDataRoshanEventType!]
  runeEvents: [MatchPlaybackDataRuneEventType!]
  towerDeathEvents: [MatchPlaybackDataTowerDeathEventType!]
  wardEvents: [MatchPlaybackDataWardEventType!]
}

type MatchPlaybackDataBuildingEventType {
  time: Int!
  type: String
  isRadiant: Boolean
  npcId: Int
}

type MatchPlaybackDataRoshanEventType {
  time: Int!
}

type MatchPlaybackDataRuneEventType {
  time: Int!
  action: Int!
  rune: Int!
}

type MatchPlaybackDataTowerDeathEventType {
  time: Int!
  radiant: Int!
  dire: Int!
}

type MatchPlaybackDataWardEventType {
  time: Int!
  action: String
  wardType: String
  fromPlayer: Int
}

type MatchPlayerType {
  steamAccountId: Long
  heroId: Int!
  isRadiant: Boolean!
  playerSlot: Int!
  kills: Int!
  deaths: Int!
  assists: Int!
  networth: Int
  level: Int
  imp: Float
}

type MatchEventType {
  time: Int!
  type: String!
  isRadiant: Boolean
  steamAccountId: Long
  heroId: Int
  value: String
}

type MatchFightType {
  startTime: Int!
  endTime: Int!
  radiantKills: Int!
  direKills: Int!
  radiantNetworthDelta: Int
  participants: [MatchFightParticipantType!]!
}

type MatchFightParticipantType {
  steamAccountId: Long
  heroId: Int!
  isRadiant: Boolean!
  kills: Int!
  deaths: Int!
}

type MatchEconomyType {
  time: Int!
  radiantNetworth: Int
  direNetworth: Int
  radiantExperience: Int
  direExperience: Int
}
