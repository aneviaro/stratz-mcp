fragment LeagueFields on LeagueType {
  id
  name
  displayName
  region
  tier
  startDateTime
  endDateTime
}

query StratzGetLeague($id: Int!) {
  league(id: $id) {
    ...LeagueFields
  }
}

query StratzListLeagues($request: LeagueRequestType!) {
  leagues(request: $request) {
    ...LeagueFields
  }
}

query StratzListLeagueMatches($id: Int!, $request: LeagueMatchesRequestType!) {
  league(id: $id) {
    id
    matches(request: $request) {
      ...MatchSummaryFields
    }
  }
}

query StratzListLiveMatches($request: MatchLiveRequestType!) {
  live {
    matches(request: $request) {
      id: matchId
      startDateTime: createdDateTime
      gameTime
      gameModeId: gameMode
      spectatorCount: spectators
      radiantTeamId
      direTeamId
      league {
        ...LeagueFields
      }
      players {
        steamAccountId
        heroId
        isRadiant
        playerSlot
        kills: numKills
        deaths: numDeaths
        assists: numAssists
        networth
        level
      }
    }
  }
}
