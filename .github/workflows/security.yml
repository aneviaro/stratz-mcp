name: security

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.25.x
          cache: true
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...
      - name: OSV module scan
        run: |
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.3.3
          osv-scanner scan source -r .
      - name: License inventory and policy
        run: |
          go install github.com/google/go-licenses@v1.6.0
          go-licenses check ./... --allowed_licenses=Apache-2.0,BSD-2-Clause,BSD-3-Clause,ISC,MIT,MPL-2.0
          make notices
          git diff --exit-code -- THIRD_PARTY_NOTICES
      - name: Secret scan
        uses: gitleaks/gitleaks-action@cb7149a9b57168e998490483d6bb80d3c9f645bc # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Race tests
        run: go test -race ./...
