name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  clearance:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: 1.25.x
          cache: true
      - name: Restrict publishing source
        run: |
          test "$GITHUB_REPOSITORY" = "aneviaro/stratz-mcp"
          test "$GITHUB_REF_TYPE" = "tag"
      - id: version
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
      - name: Require STRATZ public-release clearance
        run: go run ./cmd/release-clearance-check
      - name: Validate source
        run: make check

  artifacts:
    needs: clearance
    runs-on: ubuntu-latest
    environment: public-release
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: 1.25.x
          cache: true
      - name: Build native archives
        env:
          VERSION: ${{ needs.clearance.outputs.version }}
          REVISION: ${{ github.sha }}
        run: make package
      - name: Generate SPDX and CycloneDX SBOMs
        run: |
          go install github.com/anchore/syft/cmd/syft@v1.26.1
          for artifact in dist/release/*.tar.gz dist/release/*.zip; do
            syft "$artifact" -o "spdx-json=${artifact}.spdx.json"
            syft "$artifact" -o "cyclonedx-json=${artifact}.cdx.json"
          done
      - name: Install cosign
        uses: sigstore/cosign-installer@e3f7d755804fa740df8ae904b0e0fb7b980b6ed7 # v3.9.2
      - name: Sign checksum manifest
        run: cosign sign-blob --yes --bundle dist/release/checksums.sigstore.json dist/release/checksums.txt
      - name: Attest native artifacts
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/release/*
      - name: Upload release assets
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          files: dist/release/*

  image:
    needs: clearance
    runs-on: ubuntu-latest
    environment: public-release
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: 1.25.x
          cache: true
      - name: Build image binaries
        env:
          VERSION: ${{ needs.clearance.outputs.version }}
          REVISION: ${{ github.sha }}
        run: make package
      - uses: docker/setup-qemu-action@68827325e0b33c7199eb31dd4e31fbe9023e06e3 # v3.6.0
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/aneviaro/stratz-mcp:${{ needs.clearance.outputs.version }}
            ghcr.io/aneviaro/stratz-mcp:${{ github.sha }}
          build-args: |
            VERSION=${{ needs.clearance.outputs.version }}
            REVISION=${{ github.sha }}
      - uses: sigstore/cosign-installer@e3f7d755804fa740df8ae904b0e0fb7b980b6ed7 # v3.9.2
      - name: Sign image
        run: cosign sign --yes "ghcr.io/aneviaro/stratz-mcp@${{ steps.build.outputs.digest }}"
      - name: Attest image
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ghcr.io/aneviaro/stratz-mcp
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
